# The live site.
#
# Every push to the default branch builds the app and publishes it to GitHub
# Pages at https://<owner>.github.io/<repo>/. The clips are committed under
# `public/media/`, so the deployed site is self-contained — no CDN, no origin
# to keep alive.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sensual-video-shader-2nv3ya]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live site: let a running deploy finish rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pages serves this repo under /<repo>/, not at the root.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
